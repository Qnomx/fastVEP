name: CI

on:
  # Every pull request, whatever it targets. Filtering by base branch meant a PR
  # into an integration branch got no checks at all, which is exactly where work
  # lands before it reaches master.
  pull_request:
  push:
    branches: [master, qnomx-integration]

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every target (libs, bins, tests)
        run: cargo check --workspace --all-targets
      - name: Run all tests (unit + integration)
        run: cargo test --workspace
